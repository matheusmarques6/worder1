# Render Blueprint — o runtime de agentes IA (runtime/) como web service.
#
# Deploy: Render Dashboard → New → Blueprint → este repo → preencher os
# segredos (sync: false) → Apply. O serviço builda de runtime/Dockerfile,
# expõe /healthz (o Render usa como health check) e o processo único asyncio
# (coalescer + workers + sender + heartbeat + listener) sobe dormante: filas
# vazias e rollout vazio = idle seguro até o cutover.
#
# DSNs distintas AGENTS_WORKER_DB_URL / AGENTS_SENDER_DB_URL: SESSION POOLER
# com runtime_worker_login.<project-ref> / runtime_sender_login.<project-ref>.
# Provisionar senhas fora do repositório após a migration runtime_minimum_login.
# A conexão direta (db.<ref>.supabase.co) é IPv6 e o egress do Render é IPv4.
# Transaction pooler (porta 6543) NÃO serve: o engine usa `set role` e leases
# por sessão (runtime/DEPLOY.md).

services:
  - type: web
    name: worder-agents-runtime
    branch: claude/debug-console-error-FWrLE
    runtime: docker
    rootDir: runtime
    dockerfilePath: ./Dockerfile
    # Região do Render mais próxima do Supabase sa-east-1 (São Paulo): entre
    # oregon/ohio/virginia/frankfurt/singapore, virginia é a de menor RTT
    # até a costa leste da América do Sul (plano IA 15/10/2026, M0 passo 5).
    region: virginia
    plan: starter
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      # -- o processo ---------------------------------------------------------
      - key: AGENTS_HTTP_PORT
        value: "10000" # o Render espera o serviço ouvindo em PORT=10000
      - key: AGENTS_RESPONDER
        value: agents_runtime.agent_core.responder:agent_responder
      - key: AGENTS_TOUCHER
        value: agents_runtime.agent_core.toucher:agent_toucher
      - key: AGENTS_CHANNEL
        value: agents_runtime.channels.cloud_api:from_env
      - key: AGENTS_WORKER_SET_ROLE
        value: worker_role
      - key: AGENTS_SENDER_SET_ROLE
        value: sender_role
      - key: AGENTS_PROCESS_NAME
        value: agents-runtime-render
      # Lida desde 2026-10-15 (runtime/docs/alteracoes/2026-10-15-02). Cada
      # worker é uma conexão longa no pooler: subir exige conferir o limite.
      - key: AGENTS_WORKERS
        value: "2"
      - key: AGENTS_LOG_LEVEL
        value: INFO
      - key: DEPLOY_ENV
        value: production
      - key: AGENTS_META_API_VERSION
        value: v22.0
      # -- segredos (preenchidos no Apply do Blueprint; nunca no repo) --------
      - key: AGENTS_WORKER_DB_URL # runtime_worker_login, session pooler
        sync: false
      - key: AGENTS_SENDER_DB_URL # runtime_sender_login, session pooler
        sync: false
      # Origem HTTPS usada para validar as URLs assinadas de mídia privada.
      - key: SUPABASE_URL
        sync: false
      - key: AGENTS_OPENROUTER_API_KEY # chave da PLATAFORMA (Judge 1 + embeddings)
        sync: false
      # Item 20 da auditoria: também abre a credencial Meta por conta agora
      # (whatsapp_business_accounts.access_token_encrypted) — não existe mais
      # um AGENTS_META_ACCESS_TOKEN global.
      - key: ENCRYPTION_KEY # o MESMO secret do app Next.js (secret_box)
        sync: false
      - key: AGENTS_PREVIEW_TOKEN # o mesmo valor vai na Vercel p/ o preview
        sync: false
      # Com o token, os spans de domínio (turn, send, llm_call, tool_call)
      # também vão ao Logfire (runtime/docs/alteracoes/2026-10-15-01); não é
      # preciso OTEL_EXPORTER_OTLP_ENDPOINT.
      - key: AGENTS_LOGFIRE_TOKEN # opcional (D13): vazio = Logfire desligado
        sync: false
