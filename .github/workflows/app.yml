# CI do app Next.js (Vercel segue dono do deploy; aqui é o gate de teste).
# Chamado pelo workflow release, que sempre cria o gate do commit candidato.
#
# Jobs bloqueantes: security, vitest (comportamento), tsc (imports/tipos)
# e next build (falha em tempo de módulo, que o tsc não vê).
# O build ficou informativo até 18/08 por não se saber se era verde; é.

name: app

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redis:
    name: Real Redis atomicity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:redis:local

  security:
    name: Security candidate checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          printf 'GITLEAKS_BIN=%s/gitleaks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: node --test scripts/security/*.test.mjs
      - name: Reject new secrets in the candidate history
        env:
          SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/security/check-candidate.mjs
      - run: pnpm install --frozen-lockfile
      - name: Reject high and critical production dependency advisories
        run: pnpm audit --prod --audit-level high

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for executable HTML isolation tests
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:ci-policy

  # BLOQUEANTE: o unico mecanismo capaz de pegar um import orfao depois de uma
  # delecao (pacote F1). Nao precisa de env — `tsc` nao executa modulo nenhum,
  # ao contrario do `next build`, que e por isso que este job existe separado.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # BLOQUEANTE desde 18/08: nasceu informativo porque o repo nunca tinha tido
    # CI e ninguém sabia se passava. Passou — run 32094491364, 3m13s, no push da
    # onda 3 da limpeza. O `build` pega o que o `tsc` não pega: falha de import
    # em tempo de módulo, que só aparece quando o Next carrega a rota de fato.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
      ENCRYPTION_KEY: ci-dummy-encryption-key-32-bytes!
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
