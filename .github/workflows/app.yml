# CI do app Next.js (Vercel segue dono do deploy; aqui é o gate de teste).
# Path filters complementares aos do runtime.yml (D2).
#
# Três jobs, os três bloqueantes: vitest (comportamento), tsc (import órfão e
# re-export de barril) e next build (falha em tempo de módulo, que o tsc não vê).
# O build ficou informativo até 18/08 por não se saber se era verde; é.

name: app

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.js"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "tailwind.config.ts"
      - ".github/workflows/app.yml"
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.js"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "tailwind.config.ts"
      - ".github/workflows/app.yml"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # BLOQUEANTE: o unico mecanismo capaz de pegar um import orfao depois de uma
  # delecao (pacote F1). Nao precisa de env — `tsc` nao executa modulo nenhum,
  # ao contrario do `next build`, que e por isso que este job existe separado.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # BLOQUEANTE desde 18/08: nasceu informativo porque o repo nunca tinha tido
    # CI e ninguém sabia se passava. Passou — run 32094491364, 3m13s, no push da
    # onda 3 da limpeza. O `build` pega o que o `tsc` não pega: falha de import
    # em tempo de módulo, que só aparece quando o Next carrega a rota de fato.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
      ENCRYPTION_KEY: ci-dummy-encryption-key-32-bytes!
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
