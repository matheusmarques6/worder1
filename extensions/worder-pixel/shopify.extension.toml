api_version = "2026-01"

[[extensions]]
type = "web_pixel_extension"
name = "Worder Tracking Pixel"
runtime_context = "strict"

[extensions.settings]
  [extensions.settings.fields.accountId]
  name = "Account ID"
  description = "Your Worder organization ID"
  type = "single_line_text_field"
  validations = []

  [extensions.settings.fields.storeId]
  name = "Store ID"
  description = "Your Worder store ID"
  type = "single_line_text_field"
  validations = []

  [extensions.settings.fields.trackingEndpoint]
  name = "Tracking Endpoint"
  description = "The URL to send tracking events to"
  type = "single_line_text_field"
  validations = []
