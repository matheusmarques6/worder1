[project]
name = "agents-runtime"
version = "0.1.0"
description = "WhatsApp AI agents runtime — workers, coalescer, scheduler and senders as tasks of a single asyncio process."
requires-python = ">=3.13"
# Postgres is the only thing the runtime talks to directly (ADR-01), so psycopg3
# is the one production dependency the queue transport needs. It is also what
# `obs` will instrument later (observabilidade §3, instrument_psycopg), so the
# test harness and the runtime speak to the database through the same driver
# rather than two.
dependencies = [
    "psycopg[binary]>=3.2",
    # The ONE production HTTP client. The Cloud API adapter is its first
    # consumer; the E8 connectors (Shopify, Nuvemshop, Yampi) are its next.
    # A second HTTP client would be a second set of timeout and pooling
    # behaviours to reason about.
    "httpx>=0.27",
    "cryptography>=50.0.0",
    # D13 (Adendo §B): Logfire com as instrumentações que o runtime usa de
    # verdade — httpx (provedores), psycopg (banco) e métricas de sistema.
    # A ativação é por token (AGENTS_LOGFIRE_TOKEN); sem token, custo zero.
    "logfire[httpx,psycopg,system-metrics]>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "freezegun>=1.5",
    "ruff>=0.14",
    "import-linter>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_runtime"]

# --- Tests -------------------------------------------------------------------
# Levels are defined in core/testes-e-cicd.md §1. --strict-markers makes an
# undeclared marker an error, not a warning: a test can never silently escape
# its level and thus the CI gate that runs it.
[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: no I/O at all — no Postgres, no network, no filesystem. Whole suite < 60s",
    "db: real Postgres — SQL functions, constraints, triggers",
    "rls: cross-tenant leak suite, run with all three credentials (JWT, worker_role, sender_role)",
    "pipeline: full runtime loop + Postgres + pgmq; LLM and external APIs simulated",
    "contract: ONE real external API. Never blocking on a PR",
]

# --- Lint --------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "ASYNC",    # async correctness
    "T20",      # flake8-print — `print` is forbidden: logging goes through the Logfire SDK
    "DTZ",      # naive datetimes are a bug in a system that reasons about timezones
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests may build naive datetimes on purpose when asserting clock behaviour.
"tests/**" = ["DTZ"]

# --- Module boundaries -------------------------------------------------------
# Fitness function nº 1 of arquitetura §8. These contracts are what make the
# module table of arquitetura §3 an enforced boundary instead of a convention.
[tool.importlinter]
root_packages = ["agents_runtime"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "channels and connectors never know about each other"
type = "independence"
modules = [
    "agents_runtime.channels",
    "agents_runtime.connectors",
]

[[tool.importlinter.contracts]]
name = "nothing calls the WhatsApp API except senders (channels)"
type = "forbidden"
source_modules = [
    "agents_runtime.agent_core",
    "agents_runtime.dispatch",
    "agents_runtime.judges",
    "agents_runtime.onboarding",
]
forbidden_modules = ["agents_runtime.channels"]

[[tool.importlinter.contracts]]
name = "only the repository layer reaches the database"
type = "forbidden"
# Auditoria 2026-08-28 item 16: a versão anterior proibia importar
# `agents_runtime.repository.driver`, um módulo que nunca existiu de verdade
# (só docstring, nenhum chamador — ele foi apagado). Ninguém importava esse
# nome, então o contrato passava verde sem checar nada. `psycopg` é o que
# efetivamente fala com o banco, e com `include_external_packages = true`
# (acima) o linter agora o enxerga como qualquer outro módulo.
#
# Fix round 1 (revisão de 6255fc18): a primeira versão desta lista só cobria
# os pacotes que já tinham import de psycopg conhecido, deixando `crypto/`,
# `evals/`, `obs/` e os módulos soltos (`clock.py`, `config.py`,
# `randomness.py`, `__main__.py`) sem checagem — um `import psycopg` ali
# ficaria verde. A lista agora é TODO módulo/pacote de primeiro nível de
# `agents_runtime`, exceto os dois exemptos abaixo, para que o nome do
# contrato ("only the repository layer reaches the database") corresponda ao
# que ele de fato cobre.
#
# `agents_runtime.app` continua deliberadamente ausente: é a composition root
# onde os pools são criados e entregues a todo mundo, então é o único módulo
# que precisa conhecer o driver. `agents_runtime.repository` é o próprio alvo
# do contrato (source e forbidden não podem se sobrepor).
source_modules = [
    "agents_runtime.__main__",
    "agents_runtime.agent_core",
    "agents_runtime.channels",
    "agents_runtime.clock",
    "agents_runtime.commerce",
    "agents_runtime.config",
    "agents_runtime.connectors",
    "agents_runtime.crypto",
    "agents_runtime.dispatch",
    "agents_runtime.evals",
    "agents_runtime.inbox",
    "agents_runtime.judges",
    "agents_runtime.obs",
    "agents_runtime.onboarding",
    "agents_runtime.queueing",
    "agents_runtime.quota",
    "agents_runtime.randomness",
    "agents_runtime.server",
    "agents_runtime.tools",
]
forbidden_modules = ["psycopg"]
# `repository/*` importa psycopg de propósito — é o ponto único que fala com o
# driver — então qualquer módulo que chama uma função do repository "alcança"
# psycopg indiretamente. Proibir isso também derrubaria a arquitetura inteira
# (todo módulo que usa `repository.agent`, por exemplo). O que a fronteira
# proíbe é o IMPORT DIRETO de psycopg fora de repository/; a cadeia indireta
# via repository é o desenho pretendido, não a violação.
allow_indirect_imports = "true"
# Dívida pré-existente: 10 módulos (fora `agents_runtime.app`, já exempto acima)
# abrem conexões psycopg diretamente em vez de passar pelo `repository/`. Ligar
# a checagem de verdade (linha acima) sem consertar os 11 de uma vez deixaria a
# tarefa virar uma refatoração arquitetural fora de escopo — então cada um vira
# uma exceção NOMEADA aqui, visível e contável, em vez de a trava ficar muda.
# Encolher esta lista é o trabalho de uma tarefa futura, não apagar a linha.
ignore_imports = [
    "agents_runtime.agent_core.responder -> psycopg",
    "agents_runtime.agent_core.toucher -> psycopg",
    "agents_runtime.commerce.offer_engine -> psycopg",
    "agents_runtime.queueing.sender -> psycopg",
    "agents_runtime.queueing.worker -> psycopg",
    "agents_runtime.server -> psycopg",
    "agents_runtime.tools.base -> psycopg",
    "agents_runtime.tools.coupon -> psycopg",
    "agents_runtime.tools.customer -> psycopg",
    "agents_runtime.tools.knowledge -> psycopg",
]
