# Compose local do runtime — dois modos que não se misturam (ver
# docs/superpowers/specs/2026-08-12-docker-local-db-runtime-design.md):
#
#   bancada  →  db local (espelho de produção via scripts/mirror.ps1) +
#               runtime MUDO (sem canal). docker compose --profile bancada up -d
#   piloto   →  só o runtime, apontando ao Supabase da NUVEM, envio REAL.
#               docker compose --profile piloto up -d
#
# Os perfis coexistem (portas e process names distintos). Os .env reais
# (.env.bancada / .env.piloto) ficam fora do git — templates em *.example.

x-runtime-base: &runtime-base
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import os, psycopg; psycopg.connect(os.environ['SUPABASE_DB_URL'], connect_timeout=5).close()",
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s

services:
  db:
    profiles: ["bancada"]
    image: supabase/postgres:17.6.1.160
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  runtime-bancada:
    <<: *runtime-base
    profiles: ["bancada"]
    env_file: .env.bancada
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "10000:10000"

  runtime-piloto:
    <<: *runtime-base
    profiles: ["piloto"]
    env_file: .env.piloto
    # O resolver interno do Docker Desktop (192.168.65.7) cai sozinho de vez em
    # quando: em 17/ago o pooler do Supabase E o host do Logfire ficaram
    # irresolvíveis ao mesmo tempo por ~1min, e o runtime reiniciou 8 vezes.
    # Aqui todo destino é externo (nuvem), não há service discovery do compose
    # para preservar — resolver direto tira esse ponto de falha do caminho.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "10001:10000"

volumes:
  db_data:
